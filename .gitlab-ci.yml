include:
  - project: ckware/solarview-base
    ref: main
    file: .gitlab-ci.yml

variables:
  IMAGE_PLATFORMS: 'linux/amd64,linux/i386,linux/arm/v7,linux/arm/v6'
  DOCKERFILE_URL: 'https://gitlab.com/ckware/solarview-base/-/raw/main/Dockerfile'
  BUILD_ARGS: 'APP_NAME=fronius-fb'
  IMAGE_TITLE: 'SolarView Fronius-Proxy'
  UPDATE_CHECK_URLS: 'http://www.solarview.info/downloads/fronius-fb.zip'
